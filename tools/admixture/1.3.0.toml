type = "file"
cardinality = "one"
description = "Per-individual ancestry fractions (.Q)"

[[tool.outputs]]
name = "allele_freqs"
type = "file"
cardinality = "one"
description = "Per-population allele frequencies (.P)"

[tool.entrypoint]
# Auto-detected from recipe test commands. Verify this is correct.
